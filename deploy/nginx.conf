# Serve city-wide MapLibre viewer + PMTiles with HTTP Range support.
# Lookup API is proxied to the `api` service.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index city_map.html;

    # PMTiles / static assets — Range requests required
    location / {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range";
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ /city_map.html;
    }

    location = /reno_risk.pmtiles {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range";
        add_header Cache-Control "public, max-age=86400";
        # nginx serves Accept-Ranges / 206 natively for static files
    }

    location /api/ {
        proxy_pass http://api:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
}
