# Serve MapLibre county map + PMTiles (HTTP Range). /api/* → api service.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index city_map.html;

    # HTML viewer — avoid stale cached pages after updates
    location = /city_map.html {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache";
    }

    # Missing .pmtiles must 404 (not fall back to HTML — that breaks PMTiles magic check)
    location ~* \.pmtiles$ {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range";
        add_header Cache-Control "public, max-age=300";
        types { }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # Other static assets — Range requests required
    location / {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range";
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ /city_map.html;
    }

    location /api/ {
        proxy_pass http://api:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
}
