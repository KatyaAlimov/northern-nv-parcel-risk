services:
  # Public entry: static city_map.html + reno_risk.pmtiles (Range/206 via nginx)
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./outputs:/usr/share/nginx/html:ro
      - ./templates/city_map.html:/usr/share/nginx/html/city_map.html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # Address/APN lookup for the city map (proxied at /api/ from nginx)
  api:
    build: .
    volumes:
      - ./outputs:/app/outputs:ro
      - ./config:/app/config:ro
      - ./templates:/app/templates:ro
      - ./parcel_lookup.py:/app/parcel_lookup.py:ro
      - ./regions_loader.py:/app/regions_loader.py:ro
      - ./spatial_ops.py:/app/spatial_ops.py:ro
      - ./05_serve_city_map.py:/app/05_serve_city_map.py:ro
    expose:
      - "8081"
    restart: unless-stopped

  # Streamlit live street/APN/district risk lookup
  app:
    build: .
    command:
      [
        "python3",
        "-m",
        "streamlit",
        "run",
        "app.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
        "--server.headless",
        "true",
        "--browser.gatherUsageStats",
        "false",
      ]
    ports:
      - "8501:8501"
    volumes:
      - ./config:/app/config:ro
      - ./app.py:/app/app.py:ro
      - ./risk_engine.py:/app/risk_engine.py:ro
      - ./config_loader.py:/app/config_loader.py:ro
      - ./regions_loader.py:/app/regions_loader.py:ro
      - ./parcel_lookup.py:/app/parcel_lookup.py:ro
      - ./spatial_ops.py:/app/spatial_ops.py:ro
    environment:
      - CITY_MAP_URL=http://localhost:8080/city_map.html
    restart: unless-stopped
