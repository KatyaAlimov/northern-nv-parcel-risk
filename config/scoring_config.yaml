# Nevada Parcel Risk scoring configuration
#
# Weights and λ are placeholders until calibrated with local experts / hazard plans.
# The pipeline is multi-county (see config/regions.yaml); this file is shared scoring.
# ---------------------------------------------------------------------------
# Edit this file to change AHP weights, fault decay, flood tiers, and risk
# thresholds. Citations document the *methods and regulatory concepts*;
# numeric preferences (e.g. Flood=1.5×Fault, λ=0.0015) are project assumptions
# pending local expert / Hazard Mitigation Plan calibration.
# ---------------------------------------------------------------------------

meta:
  version: "1.1"
  jurisdiction: "Nevada (multi-county parcel risk demo)"
  purpose: >
    Transparent flood + fault composite scoring for portfolio / developer-analyst demos.
  disclaimer: >
    Prototype decision-support scores only. Not an official FEMA flood
    determination, geologic hazard report, or insurance rating.

ahp:
  criteria: ["Flood", "Fault"]
  # Saaty pairwise matrix: entry (i,j) = preference of i over j
  # Flood preferred 1.5× over Fault (placeholder regional judgment)
  pairwise_matrix:
    - [1.0, 1.5]
    - [0.6666666666666666, 1.0]
  consistency_ratio_threshold: 0.10
  notes: >
    Analytic Hierarchy Process (Saaty 1980). Replace the 1.5 preference with
    expert pairwise judgments or priorities from the Washoe MJHMP.

fault:
  model: "exponential_decay"
  # score = 100 * exp(-lambda * distance_meters), clamped [0, 100]
  decay_lambda: 0.0015
  # Alquist-Priolo–inspired reference distances (meters) for documentation /
  # validation checkpoints (not hard brackets in the continuous model)
  buffers_meters:
    core_zone: 150        # ~AP-inspired core proximity target (~score 80)
    advisory: 500         # mid-field checkpoint (~score 47)
    far_field: 2000       # distal checkpoint (~score < 5)
  calibration_targets:
    - {distance_m: 0, score_approx: 100}
    - {distance_m: 150, score_approx: 80}
    - {distance_m: 500, score_approx: 47}
    - {distance_m: 2000, score_approx: 5}
  notes: >
    Continuous decay is a GIS-MCDA modeling choice. Anchor distances follow
    Alquist-Priolo Earthquake Fault Zoning concepts; λ is calibrated to those
    checkpoints, not taken from a Washoe-specific attenuation study.

flood:
  # FEMA NFIP / FIRM zone → sub-score (0–100)
  sfha_100yr_zones: ["A", "AE", "AH", "AO", "VE", "V"]
  sfha_100yr_score: 100.0
  moderate_500yr_zones: ["X500", "B"]
  moderate_500yr_score: 50.0
  # Also treat ZONE_SUBTY containing these tokens as moderate (0.2% annual chance)
  moderate_subtype_tokens: ["0.2", "500"]
  minimal_score: 0.0
  notes: >
    Ordinal encoding of NFIP flood hazard classes for MCDA. Not a HAZUS
    depth-damage function or NFIP premium formula.

tiers:
  high_min: 70.0
  moderate_min: 30.0
  # HIGH: score >= high_min
  # MODERATE: moderate_min <= score < high_min
  # LOW: score < moderate_min

citations:
  - id: saaty1980
    title: "The Analytic Hierarchy Process"
    author: "Saaty, T. L."
    year: 1980
    publisher: "McGraw-Hill"
    used_for: "AHP pairwise weighting and consistency ratio"
  - id: alquist_priolo
    title: "Alquist-Priolo Earthquake Fault Zoning Act"
    author: "State of California"
    year: 1972
    url: "https://www.conservation.ca.gov/cgs/alquist-priolo"
    used_for: "Fault-hazard zoning concept and core proximity buffer reference"
  - id: fema_nfip
    title: "National Flood Insurance Program / Flood Insurance Rate Maps"
    author: "FEMA"
    url: "https://www.fema.gov/flood-insurance"
    used_for: "SFHA vs moderate vs minimal flood hazard classes"
  - id: usgs_qfaults
    title: "Quaternary Fault and Fold Database"
    author: "USGS"
    url: "https://www.usgs.gov/programs/earthquake-hazards/faults"
    used_for: "Active/quaternary fault line geometry (Nevada layer)"
  - id: washoe_opendata
    title: "Washoe County Open Data Parcels"
    author: "Washoe County"
    url: "https://wcgisweb.washoecounty.us/"
    used_for: "Parcel geometry and situs attributes"
