# Northern Nevada county definitions for the parcel risk pipeline.
# Each region sets bounds, map camera, parcel ArcGIS REST URL, field maps,
# and optional lookup / area presets. Add or edit counties here.
#
# Map-ready counties need a matching outputs/<stem>_risk.pmtiles file
# (Washoe uses legacy filename reno_risk.pmtiles).

default_region: washoe
regions:
  washoe:
    name: Washoe County
    state: NV
    description: 'Washoe County parcels via Washoe OpenData (street/APN). Optional CITY filter (RENO /
      SPARKS / INCLINE VILLAGE, etc.). Full-county PMTiles available.

      '
    bounds:
    - -120.1325
    - 39.1624
    - -119.1521
    - 42.013
    center:
    - -119.81
    - 39.53
    zoom: 11
    geocode_suffix: Washoe County, Nevada
    parcels:
      url: https://wcgisweb.washoecounty.us/arcgis/rest/services/OpenData/OpenData/MapServer/0/query
      out_fields: OBJECTID,APN,STREETNUM,STREETDIR,STREET,CITY,SITUSZIP,FullAddress
      base_where: 1=1
      max_record_count: 1000
      search:
        apn_field: APN
        street_field: STREET
        city_field: CITY
      field_map:
        APN: APN
        STREETNUM: STREETNUM
        STREETDIR: STREETDIR
        STREET: STREET
        CITY: CITY
        FullAddress: FullAddress
    area_presets:
      Downtown Reno (Truckee corridor):
      - -119.835
      - 39.515
      - -119.8
      - 39.54
      Midtown / Virginia St:
      - -119.82
      - 39.5
      - -119.785
      - 39.525
      University / N Virginia:
      - -119.835
      - 39.535
      - -119.8
      - 39.56
      Airport / S Reno:
      - -119.8
      - 39.48
      - -119.75
      - 39.52
      West Reno / Idlewild:
      - -119.87
      - 39.505
      - -119.83
      - 39.535
      Sparks core:
      - -119.77
      - 39.52
      - -119.73
      - 39.55
      Incline Village / Tahoe:
      - -119.98
      - 39.22
      - -119.9
      - 39.28
      Washoe County (full extent):
      - -120.1325
      - 39.1624
      - -119.1521
      - 42.013
